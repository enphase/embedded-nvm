[workspace]
resolver = "3"
members = ["postcard-versioned", "nvm-settings"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/enphase/nvm-settings"
rust-version = "1.85"

[workspace.dependencies]
postcard = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false }
