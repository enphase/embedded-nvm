[workspace]
resolver = "3"
members = ["versioned-postcard", "embedded-nvm-settings"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/enphase/embedded-nvm"

[workspace.dependencies]
postcard = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false }
