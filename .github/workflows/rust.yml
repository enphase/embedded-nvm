name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # feature set for testing, since there are no default features
  SETTINGS_FEATURES: sequential-storage,versioned-postcard,postcard

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Formatting
      run: cargo fmt --all --check
    - name: Clippy (versioned-postcard)
      run: cargo clippy -p versioned-postcard --all-targets --all-features -- -D warnings
    - name: Clippy (embedded-nvm-settings)
      run: cargo clippy -p embedded-nvm-settings --all-targets --features $SETTINGS_FEATURES -- -D warnings
    - name: Test (versioned-postcard)
      run: cargo test -p versioned-postcard --features max-size --verbose
    - name: Test (embedded-nvm-settings)
      run: cargo test -p embedded-nvm-settings --features $SETTINGS_FEATURES --verbose
    - name: Publish dry-run
      run: cargo publish --dry-run --workspace
