[package]
name = "embedded-nvm-settings"
version = "0.1.0"
description = "Memory-cached NVM settings for embedded with deferred async commit and ISR safety"
categories = ["embedded", "no-std"]
keywords = ["nvm", "settings", "flash", "embedded"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
embassy-sync = { version = "0.7.2" }
critical-section = { version = "1.2" }

sequential-storage = { version = "7", optional = true }
embedded-storage-async = { version = "0.4.1", optional = true }
versioned-postcard = { version = "0.1", path = "../versioned-postcard", optional = true }
postcard = { version = "1.1", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, optional = true }
defmt = { version = "1.0.1", optional = true }

[features]
default = []
sequential-storage = ["dep:sequential-storage", "dep:embedded-storage-async"]
versioned-postcard = ["dep:versioned-postcard", "dep:serde"]
postcard = ["dep:postcard", "dep:serde"]
defmt = ["dep:defmt", "versioned-postcard?/defmt", "sequential-storage?/defmt"]

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["experimental-derive"] }
versioned-postcard = { path = "../versioned-postcard", features = ["max-size"] }
embassy-futures = "0.1.2"
sequential-storage = { version = "7", features = ["_test"] }
embedded-storage-async = { version = "0.4.1" }

[[test]]
name = "integration"
required-features = ["postcard"]

[[test]]
name = "seq_storage_backend"
required-features = ["postcard", "sequential-storage"]
